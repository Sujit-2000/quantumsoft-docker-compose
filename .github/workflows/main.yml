name: Deploy to EC2 using SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Configure AWS CLI
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Build and push Docker images
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push images
      run: |
        docker compose build
        docker compose push
  
     
     # Send docker-compose.yml to EC2 using SSM    
    - name: Upload compose file to EC2 via SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["mkdir -p /home/ec2-user/app && cat <<EOF > /home/ec2-user/app/docker-compose.yml","'$(sed "s/\"/'/g" docker-compose.yml)'","EOF"]' \
          --output text

    # Trigger deployment on EC2
    - name: Deploy using SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "cd /home/ec2-user/app",
            "docker compose pull",
            "docker compose down",
            "docker compose up -d"
          ]' \
          --output text
